name: Daytrack
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  DaytrackKit:
    path: DaytrackKit
# The example holds defaults and #include? "Local.xcconfig", so the real file applies when present.
configFiles:
  Debug: Local.xcconfig.example
  Release: Local.xcconfig.example
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
targets:
  Daytrack:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).daytrack
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: DaytrackKit
        product: DaytrackCore
      - package: DaytrackKit
        product: DaytrackStorage
    scheme:
      testTargets: [DaytrackAppTests, DaytrackUITests]
  DaytrackAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).daytrack.tests
    dependencies:
      - target: Daytrack
  DaytrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).daytrack.uitests
    dependencies:
      - target: Daytrack
